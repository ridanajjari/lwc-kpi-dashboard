<template>
  <lightning-card
    title="Sales &amp; Service KPIs"
    icon-name="standard:dashboard"
  >
    <template lwc:if={isLoading}>
      <div class="slds-align_absolute-center slds-p-around_large">
        <lightning-spinner
          alternative-text="Loading KPIs..."
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <template lwc:if={hasError}>
      <div class="slds-p-around_medium">
        <lightning-icon
          icon-name="utility:error"
          variant="error"
          size="small"
        ></lightning-icon>
        <span class="slds-m-left_x-small slds-text-color_error"
          >{errorMessage}</span
        >
      </div>
    </template>

    <template lwc:if={hasData}>
      <div class="kpi-grid slds-p-around_medium">
        <div class="kpi-card kpi-card--blue">
          <div class="kpi-value">{kpiData.openCases}</div>
          <div class="kpi-label">Open Cases</div>
          <lightning-icon
            icon-name="standard:case"
            size="small"
            class="kpi-icon"
          ></lightning-icon>
        </div>

        <div class="kpi-card kpi-card--green">
          <div class="kpi-value">{pipelineFormatted}</div>
          <div class="kpi-label">Open Pipeline</div>
          <lightning-icon
            icon-name="standard:opportunity"
            size="small"
            class="kpi-icon"
          ></lightning-icon>
        </div>

        <div class="kpi-card kpi-card--orange">
          <div class="kpi-value">{kpiData.newLeadsThisMonth}</div>
          <div class="kpi-label">New Leads (Month)</div>
          <lightning-icon
            icon-name="standard:lead"
            size="small"
            class="kpi-icon"
          ></lightning-icon>
        </div>

        <div class="kpi-card kpi-card--purple">
          <div class="kpi-value">{kpiData.leadConversionRate}%</div>
          <div class="kpi-label">Lead Conversion Rate</div>
          <lightning-icon
            icon-name="utility:trending"
            size="small"
            class="kpi-icon"
          ></lightning-icon>
        </div>

        <div class="kpi-card kpi-card--teal">
          <div class="kpi-value">{kpiData.closedWonThisMonth}</div>
          <div class="kpi-label">Closed Won (Month)</div>
          <lightning-icon
            icon-name="utility:check"
            size="small"
            class="kpi-icon"
          ></lightning-icon>
        </div>
      </div>
    </template>

    <div slot="footer">
      <lightning-button
        label="Refresh"
        icon-name="utility:refresh"
        onclick={handleRefresh}
        variant="neutral"
      >
      </lightning-button>
      <span class="slds-m-left_small slds-text-color_weak slds-text-body_small">
        Last updated: {lastUpdated}
      </span>
    </div>
  </lightning-card>
</template>
